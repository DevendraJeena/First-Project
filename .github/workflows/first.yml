name: Spring AI Build Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Java 21 (required for your project)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Compile the code (catches syntax errors)
      - name: Compile Code
        run: mvn clean compile

      # Step 4: Run tests
      - name: Run Tests
        run: mvn test

      # Step 5: Build the package
      - name: Build Package
        run: mvn package -DskipTests

      # Step 6: Upload artifacts
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: target/
          retention-days: 7
